<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <title>CivicSign</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1920px; height: 1080px; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f1720 0%, #134e4a 50%, #0d3d3a 100%);
      color: #fff; display: flex; align-items: center; justify-content: center;
    }
    .wrap { text-align: center; max-width: 900px; }
    .phase {
      display: inline-block; margin-bottom: 20px; padding: 10px 22px;
      border-radius: 999px; background: rgba(20,184,166,.2); border: 1px solid rgba(20,184,166,.4);
      font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: #7de8dc;
    }
    .logo { font-size: 44px; font-weight: 800; color: #14b8a6; }
    h1 { margin-top: 16px; font-size: 52px; font-weight: 800; letter-spacing: -.03em; }
    p { margin-top: 18px; font-size: 22px; color: rgba(255,255,255,.75); line-height: 1.5; }
    .cta {
      display: inline-block; margin-top: 36px; padding: 18px 42px;
      border-radius: 14px; background: #14b8a6; color: #fff;
      font-size: 20px; font-weight: 700; box-shadow: 0 12px 36px rgba(20,184,166,.35);
    }
    .url { margin-top: 24px; font-size: 20px; color: #7de8dc; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="phase">You're all set</div>
    <div class="logo">CivicSign</div>
    <h1>Document sent for signature</h1>
    <p>UK-owned · UK GDPR · Tamper-evident audit trail on every envelope</p>
    <div class="cta">Start your free trial — civicsign.com</div>
    <div class="url">Pro plan · SES &amp; AES · United Kingdom</div>
  </div>
</body>
</html>
