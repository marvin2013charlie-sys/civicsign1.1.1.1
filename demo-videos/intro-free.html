<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <title>CivicSign Free Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1920px; height: 1080px; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f1720 0%, #122a33 45%, #0d3d3a 100%);
      color: #fff; display: flex; align-items: center; justify-content: center;
    }
    .wrap { text-align: center; max-width: 1100px; padding: 48px; }
    .badge {
      display: inline-block; margin-bottom: 28px; padding: 10px 22px;
      border-radius: 999px; background: rgba(20,184,166,.18); border: 1px solid rgba(20,184,166,.45);
      font-size: 15px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
      color: #7de8dc;
    }
    h1 { font-size: 64px; font-weight: 800; letter-spacing: -.03em; line-height: 1.05; }
    p { margin-top: 22px; font-size: 28px; color: rgba(255,255,255,.78); line-height: 1.45; }
    .steps { margin-top: 48px; display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }
    .step {
      min-width: 180px; padding: 16px 22px; border-radius: 14px;
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
      font-size: 17px; color: rgba(255,255,255,.88);
    }
    .logo { font-size: 22px; font-weight: 700; color: #14b8a6; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">CivicSign</div>
    <div class="badge">Free plan walkthrough</div>
    <h1>Sign in to send your first document</h1>
    <p>Upload a PDF, add a recipient, place a signature field, and send — with a full UK audit trail.</p>
    <div class="steps">
      <div class="step">1. Sign in</div>
      <div class="step">2. Upload PDF</div>
      <div class="step">3. Prepare fields</div>
      <div class="step">4. Send for signature</div>
    </div>
  </div>
</body>
</html>
