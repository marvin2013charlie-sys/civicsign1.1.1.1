<!doctype html>
<html lang="en-GB">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#14B8A6" />
        <meta name="description" content="CivicSign is the UK's homegrown e-signature platform. Legally binding electronic signatures, tamper-evident audit trail, UK GDPR compliant. Built and hosted in Britain." />
        <meta name="robots" content="index, follow" />
        <link rel="canonical" href="https://www.civicsign.co.uk/" />
        <meta property="og:site_name" content="CivicSign" />
        <meta property="og:type" content="website" />
        <meta property="og:locale" content="en_GB" />
        <meta property="og:title" content="CivicSign | UK E-Signature Platform — Legally Binding &amp; UK GDPR Compliant" />
        <meta property="og:description" content="CivicSign is the UK's homegrown e-signature platform. Send contracts and agreements for legally binding electronic signatures with a tamper-evident audit trail." />
        <meta property="og:url" content="https://www.civicsign.co.uk/" />
        <meta property="og:image" content="https://www.civicsign.co.uk/logo512.png" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="CivicSign | UK E-Signature Platform" />
        <meta name="twitter:description" content="Legally binding UK electronic signatures with audit trail. UK-built, UK-hosted, UK GDPR compliant." />
        <meta name="twitter:image" content="https://www.civicsign.co.uk/logo512.png" />
        <!-- Favicon set: SVG for modern browsers, .ico fallback, Apple touch icon for iOS Add-to-Home.
             ?v=2 busts the browser favicon cache after the 2026 rebrand. -->
        <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg?v=2" />
        <link rel="icon" type="image/x-icon" href="%PUBLIC_URL%/favicon.ico?v=2" />
        <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png?v=2" />
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
        <!--
        manifest.json provides metadata used when your web app is installed on a
        user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
        -->
        <!--
        Notice the use of %PUBLIC_URL% in the tags above.
        It will be replaced with the URL of the `public` folder during the build.
        Only files inside the `public` folder can be referenced from the HTML.

        Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
        work correctly both with client-side routing and a non-root public URL.
        Learn how to configure a non-root public URL by running `npm run build`.
        -->
        <title>CivicSign | UK E-Signature Platform — Legally Binding &amp; UK GDPR Compliant</title>
        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
