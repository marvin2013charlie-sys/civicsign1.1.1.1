name: CI

on:
  push:
    branches: [main, master, develop, civicsign-2026-overhaul]
  pull_request:
    branches: [main, master, develop, civicsign-2026-overhaul]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: civicsign_ci
      JWT_SECRET: ci-test-jwt-secret-minimum-32-characters-long
      PLAN_ENCRYPTION_SECRET: ci-plan-encryption-secret-hex-string
      CORS_ORIGINS: http://localhost:3000
      DEV_MODE: "true"
      COOKIE_SECURE: "false"
      TRUST_PROXY: "false"
      ADMIN_EMAIL: demo@example.com
      ADMIN_PASSWORD: DemoPass123!
      INTERNAL_ADMIN_EMAIL: admin@civicbot.co.uk
      INTERNAL_ADMIN_PASSWORD: CivicSign2026!Admin
      PILOT_PASSWORD_FREE: CivicSign2026!Free
      PILOT_PASSWORD_PRO: CivicSign2026!Pro
      PILOT_PASSWORD_BUSINESS: CivicSign2026!Biz
      PILOT_PASSWORD_ORGANISATION: CivicSign2026!Org
      PILOT_PASSWORD_ORG_STAFF: CivicSign2026!Staff
      PILOT_PASSWORD_ADMIN: CivicSign2026!Admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Seed isolated CI database
        working-directory: backend
        run: python -c 'import asyncio; from db import db; from pilot_accounts import seed_pilot_accounts; asyncio.run(seed_pilot_accounts(db))'

      - name: Start API server
        working-directory: backend
        run: |
          uvicorn server:app --host 127.0.0.1 --port 8001 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8001/api/health && break
            sleep 1
          done

      - name: Pytest
        working-directory: backend
        run: python -m pytest tests/ -v

      - name: API smoke test
        run: python3 scripts/smoke_test.py
        env:
          REACT_APP_BACKEND_URL: http://127.0.0.1:8001

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Production build (lint gate)
        working-directory: frontend
        run: CI=true npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: civicsign_e2e
      JWT_SECRET: e2e-test-jwt-secret-minimum-32-characters-long
      PLAN_ENCRYPTION_SECRET: e2e-plan-encryption-secret-hex-string
      CORS_ORIGINS: http://localhost:3000
      DEV_MODE: "true"
      COOKIE_SECURE: "false"
      TRUST_PROXY: "false"
      ADMIN_EMAIL: demo@example.com
      ADMIN_PASSWORD: DemoPass123!
      INTERNAL_ADMIN_EMAIL: admin@civicbot.co.uk
      INTERNAL_ADMIN_PASSWORD: CivicSign2026!Admin
      PILOT_PASSWORD_FREE: CivicSign2026!Free
      PILOT_PASSWORD_PRO: CivicSign2026!Pro
      PILOT_PASSWORD_BUSINESS: CivicSign2026!Biz
      PILOT_PASSWORD_ORGANISATION: CivicSign2026!Org
      PILOT_PASSWORD_ORG_STAFF: CivicSign2026!Staff
      PILOT_PASSWORD_ADMIN: CivicSign2026!Admin
      E2E_FRONTEND_URL: http://localhost:3000
      E2E_BACKEND_URL: http://localhost:8001
      REACT_APP_BACKEND_URL: http://localhost:8001
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest
          npm ci --prefix frontend
          npm ci
          npx playwright install --with-deps chromium

      - name: Seed isolated CI database
        working-directory: backend
        run: python -c 'import asyncio; from db import db; from pilot_accounts import seed_pilot_accounts; asyncio.run(seed_pilot_accounts(db))'

      - name: Start backend
        working-directory: backend
        run: |
          uvicorn server:app --host 127.0.0.1 --port 8001 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8001/api/health && break
            sleep 1
          done

      - name: Start frontend
        working-directory: frontend
        run: |
          BROWSER=none PORT=3000 npm start &
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:3000 && break
            sleep 2
          done

      - name: Playwright E2E
        run: npx playwright test